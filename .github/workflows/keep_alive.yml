name: Wake Up Streamlit App (Playwright)

on:
  schedule:
    # Запускається 3 рази на день (07:00, 13:00, 19:00 UTC)
    - cron: '0 7,13,19 * * *'
  workflow_dispatch: # Дозволяє вручну натиснути "Run workflow" у вкладці Actions

jobs:
  wake-up:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Wake-Up Script
        run: |
          python keep_alive.py
